<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>21</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px; /* 增加内边距，避免边缘内容被截断 */
        }
        canvas {
            display: block;
            max-width: 90vw; /* 限制画布最大宽度为视口的90% */
            max-height: 60vh; /* 限制画布最大高度为视口的60%，给文字留足够空间 */
        }
        .happy-text {
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            margin-top: 30px;
            text-shadow: 0 0 8px #ff69b4, 0 0 12px #ff1493;
            letter-spacing: 2px;
            text-align: center; /* 文字居中 */
            max-width: 90vw; /* 文字最大宽度适配 */
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>
    <div class="happy-text">gxm happy every day</div>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            // 基于视口和最大限制计算画布尺寸
            const maxWidth = Math.min(window.innerWidth * 0.9, 600);
            const maxHeight = Math.min(window.innerHeight * 0.6, 400);
            canvas.width = maxWidth;
            canvas.height = maxHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.radius = Math.random() * 2 + 1;
                this.color = color;
                this.velX = (Math.random() - 0.5) * 1.5;
                this.velY = (Math.random() - 0.5) * 1.5;
                this.life = Math.random() * 60 + 40;
                this.alpha = 1;
            }

            update() {
                this.x += this.velX;
                this.y += this.velY;
                this.life--;
                this.alpha = this.life / 100;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        const particles = [];
        const maxParticles = 800;

        function heartCurve(t) {
            const x = 16 * Math.sin(t) ** 3;
            const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
            return {
                x: canvas.width / 2 + x * 8, // 调整缩放，适配更小画布
                y: canvas.height / 2 - y * 8
            };
        }

        function createParticles() {
            for (let i = 0; i < 5; i++) {
                if (particles.length < maxParticles) {
                    const t = Math.random() * Math.PI * 2;
                    const point = heartCurve(t);
                    const offsetX = (Math.random() - 0.5) * 15; // 缩小偏移，适配小画布
                    const offsetY = (Math.random() - 0.5) * 15;
                    const color = `hsl(${Math.random() * 30 + 330}, 100%, 65%)`;
                    particles.push(new Particle(
                        point.x + offsetX, 
                        point.y + offsetY, 
                        color
                    ));
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            createParticles();

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        animate();
    </script>
</body>
</html>
